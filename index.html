<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Profile - Ravi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hero-container">
    <div class="bg-gradient"></div>

    <div class="hero-content">
      <div class="hero-header">
        <h1 class="hero-title">Hi I'm Ravi</h1>
        <p class="hero-subtitle">Teknik Informatika</p>
      </div>

      <div class="hero-image-wrapper">
        <div class="image-box">
          <img src="Ravi.png" alt="Mochamad Ravi Ainur Rosida" class="hero-image">
        </div>

        <div class="desktop-floating">
          <div class="badge-status-wrap">
            <div class="badge-status">
              <span class="status-dot"></span>
              Another day, another W.
            </div>
          </div>

          <div class="quote-card-wrap">
            <div class="quote-card">
              <span class="quote-mark">&rdquo;</span>
              <div class="quote-bar"></div>
              <span class="quote-text">Ingin menjadi programmer handal, namun enggan ngoding</span>
            </div>
          </div>

          <div class="author-badge-wrap">
            <p class="author-text">
              <span class="author-name">Mochamad Ravi Ainur Rosida</span>
              E41261874
            </p>
          </div>
        </div>
      </div>

      <div class="mobile-floating">
        <div class="badge-status">
          <span class="status-dot"></span>
          Another day, another W.
        </div>

        <div class="quote-card">
          <span class="quote-mark">&rdquo;</span>
          <div class="quote-bar"></div>
          <span class="quote-text">Ingin menjadi programmer handal, namun enggan ngoding</span>
        </div>

        <div class="mobile-author">
          <p class="author-text">
            <span class="author-name">Mochamad Ravi Ainur Rosida</span>
            E41261874
          </p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
